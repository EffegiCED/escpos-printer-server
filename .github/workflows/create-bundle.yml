name: Build & Release Bundle

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RELEASE_DIR: eps-windows-bundle
      NSSM_URL: https://nssm.cc/release/nssm-2.24.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Setup PHP environment ---
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, sockets, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      # --- Prepare release directory ---
      - name: Prepare release directory
        run: |
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

      # --- Download and include NSSM ---
      - name: Download and extract NSSM
        run: |
          curl -fL --retry 5 --retry-all-errors -o /tmp/nssm.zip "$NSSM_URL"
          # Fork EffegiCED: l'impronta di nssm-2.24.zip, perché il pacchetto si installa come servizio con i permessi di amministratore
          echo "727d1e42275c605e0f04aba98095c38a8e1e46def453cdffce42869428aa6743  /tmp/nssm.zip" | sha256sum -c -
          unzip -q /tmp/nssm.zip -d /tmp/nssm_unpack
          find /tmp/nssm_unpack -type f -iname "nssm.exe" -exec cp {} "$RELEASE_DIR/" \;

      # --- Find latest PHP 8.4 Windows build ---
      # Fork EffegiCED: dall'elenco ufficiale in JSON, con l'impronta sha256. La pagina HTML ora risponde con un rimando e il
      # ripiego su una versione fissa scaricava una pagina d'errore al posto dello zip (rilascio 2.0.4-kassa.1, 23/11/2026).
      - name: Find latest PHP 8.4 Windows build
        id: php
        run: |
          curl -fsSL --retry 3 -A "escpos-printer-server-build" https://windows.php.net/downloads/releases/releases.json -o /tmp/php-releases.json
          PHP_ZIP=$(jq -r '."8.4"."ts-vs17-x64".zip.path' /tmp/php-releases.json)
          PHP_SHA=$(jq -r '."8.4"."ts-vs17-x64".zip.sha256' /tmp/php-releases.json)
          if [ -z "$PHP_ZIP" ] || [ "$PHP_ZIP" = "null" ]; then
              echo "PHP 8.4 per Windows non trovato in releases.json" >&2
              exit 1
          fi
          echo "php_zip=$PHP_ZIP" >> $GITHUB_OUTPUT
          echo "php_sha=$PHP_SHA" >> $GITHUB_OUTPUT

      # --- Download & unpack PHP for Windows ---
      - name: Download and unpack PHP (Windows build)
        run: |
          curl -fL --retry 3 -A "escpos-printer-server-build" -o /tmp/php.zip "https://windows.php.net/downloads/releases/${{ steps.php.outputs.php_zip }}"
          echo "${{ steps.php.outputs.php_sha }}  /tmp/php.zip" | sha256sum -c -
          unzip -q /tmp/php.zip -d /tmp/php_unpack
          mkdir -p "$RELEASE_DIR/php"
          cp -r /tmp/php_unpack/* "$RELEASE_DIR/php/"
          cp "$RELEASE_DIR/php/php.ini-production" "$RELEASE_DIR/php/php.ini"
          {
            echo "extension=intl"
            echo "extension=sockets"
            echo "extension=openssl"
            echo "extension_dir=ext"
          } >> "$RELEASE_DIR/php/php.ini"

      # --- Copy project files into bundle ---
      - name: Copy application files
        run: |
          # Copy top-level config and src directories into the bundle root (avoid nested/duplicate dirs)
          cp -r config "$RELEASE_DIR/"
          cp -r src "$RELEASE_DIR/"
          cp composer.json "$RELEASE_DIR/composer.json"
          cp eps "$RELEASE_DIR/eps"
          cp scripts/eps-install.bat "$RELEASE_DIR/eps-install.bat"
          cp scripts/eps-uninstall.bat "$RELEASE_DIR/eps-uninstall.bat"
          cp -r vendor "$RELEASE_DIR/vendor"
          # Fork EffegiCED: niente agent.json di sviluppo nel pacchetto, lo scrive l'installazione
          rm -f "$RELEASE_DIR/config/agent.json"

      # --- Generate ZIP filenames ---
      - name: Define ZIP filenames
        id: names
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-manual}"
          DATE=$(date +%Y%m%d)
          ZIP_WINDOWS="eps-windows-bundle-${TAG_NAME}-${DATE}.zip"
          ZIP_PHAR="eps-unix-bundle-${TAG_NAME}-${DATE}.zip"
          echo "zip_windows=$ZIP_WINDOWS" >> $GITHUB_OUTPUT
          echo "zip_phar=$ZIP_PHAR" >> $GITHUB_OUTPUT

      # --- Compress Windows bundle ---
      - name: Create Windows ZIP bundle
        run: |
          cd "$RELEASE_DIR"
          zip -r9 "../${{ steps.names.outputs.zip_windows }}" .
          cd ..

      # --- Upload artifacts to GitHub Release ---
      - name: Upload ZIP files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.names.outputs.zip_windows }}
